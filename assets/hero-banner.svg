    <circle cx="34" cy="17" r="5" fill="#F59E0B" opacity="0.85"/>
    <circle cx="50" cy="17" r="5" fill="#10B981" opacity="0.85"/>

    <text x="224" y="21" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#64748B">
