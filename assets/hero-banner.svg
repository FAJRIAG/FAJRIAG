    <rect x="480" y="0" width="148" height="2" rx="1" fill="#10B981"/>
    <text x="496" y="34" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="24" font-weight="800" fill="#F8FAFC">E2E</text>
