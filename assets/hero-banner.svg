    <radialGradient id="ambientGlow1" cx="20%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientGlow2" cx="82%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
    </radialGradient>

    <pattern id="engGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="420" rx="14" fill="url(#bgMain)"/>
  <rect width="1200" height="420" rx="14" fill="url(#engGrid)"/>
  <rect width="1200" height="420" rx="14" fill="url(#ambientGlow1)"/>
  <rect width="1200" height="420" rx="14" fill="url(#ambientGlow2)"/>

