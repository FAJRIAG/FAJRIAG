  </text>
  <text x="348" y="146" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#64748B">
    // Go · Python · TypeScript · Flutter · PyTorch
  </text>

