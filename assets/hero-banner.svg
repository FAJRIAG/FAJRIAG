      <text x="0" y="22" fill="#38BDF8">engineer:</text>
      <text x="72" y="22" fill="#E2E8F0">"Fajri Abdurahman Ghurri"</text>

      <text x="0" y="42" fill="#38BDF8">role:</text>
      <text x="72" y="42" fill="#34D399">"AI &amp; Full-Stack Systems Engineer"</text>

      <text x="0" y="68" fill="#38BDF8">architecture_domains:</text>
      <text x="14" y="88" fill="#818CF8">- ai_core:</text>
      <text x="112" y="88" fill="#CBD5E1">[LLMs, Hybrid-RAG, PyTorch, YOLOv8]</text>
      <text x="14" y="108" fill="#818CF8">- backend:</text>
      <text x="112" y="108" fill="#CBD5E1">[Go, FastAPI, Laravel-12, Node.js]</text>
      <text x="14" y="128" fill="#818CF8">- client_ui:</text>
      <text x="112" y="128" fill="#CBD5E1">[TypeScript, Next.js, Flutter, Swift]</text>
      <text x="14" y="148" fill="#818CF8">- data_infra:</text>
      <text x="112" y="148" fill="#CBD5E1">[PostgreSQL, Redis, VectorDB, Docker]</text>
      <text x="14" y="168" fill="#818CF8">- edge_iot:</text>
      <text x="112" y="168" fill="#CBD5E1">[ESP32, C++, MQTT, GIS-Telemetry]</text>

      <text x="0" y="196" fill="#38BDF8">production_clusters:</text>
      <text x="14" y="216" fill="#94A3B8">jrigpt_rag_engine:</text>
      <text x="165" y="216" fill="#10B981">ONLINE (Hybrid Vector Search)</text>
      <text x="14" y="236" fill="#94A3B8">alphastream_go_core:</text>
      <text x="165" y="236" fill="#10B981">ONLINE (Concurrent Workers)</text>
      <text x="14" y="256" fill="#94A3B8">smartcity_gis_grid:</text>
      <text x="165" y="256" fill="#10B981">ONLINE (Real-Time Telemetry)</text>
