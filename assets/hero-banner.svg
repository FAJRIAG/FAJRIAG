<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="15%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Main Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="16" fill="url(#glowLeft)"/>
  <rect width="1200" height="320" rx="16" fill="url(#glowRight)"/>

  <!-- Outer Frame -->
  <rect x="1.5" y="1.5" width="1197" height="317" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Accent Line -->
  <rect x="80" y="1" width="1040" height="2" fill="url(#accentGrad)" opacity="0.85"/>

  <!-- Decorative Right-Side Architecture Nodes -->
  <g opacity="0.28" stroke="#38BDF8" stroke-width="1.2" fill="none">
    <circle cx="1050" cy="85" r="4" fill="#38BDF8"/>
    <circle cx="1115" cy="130" r="3" fill="#818CF8"/>
    <circle cx="1010" cy="165" r="3.5" fill="#38BDF8"/>
    <circle cx="1085" cy="215" r="4" fill="#C084FC"/>
    <circle cx="1140" cy="245" r="2.5" fill="#38BDF8"/>
    <line x1="1050" y1="85" x2="1115" y2="130"/>
    <line x1="1050" y1="85" x2="1010" y2="165"/>
    <line x1="1115" y1="130" x2="1085" y2="215"/>
    <line x1="1010" y1="165" x2="1085" y2="215"/>
    <line x1="1085" y1="215" x2="1140" y2="245"/>
  </g>

  <!-- Status Telemetry Bar -->
  <g transform="translate(64, 42)">
    <rect x="0" y="0" width="352" height="28" rx="14" fill="#111C33" stroke="#1E3A5F" stroke-width="1"/>
    <circle cx="16" cy="14" r="4.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="18.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#94A3B8" letter-spacing="1.2">
      SYS.ARCH // AI &amp; DISTRIBUTED SYSTEMS
    </text>
  </g>

  <!-- Primary Name -->
  <text x="64" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#F8FAFC" letter-spacing="-0.8">
    Fajri Abdurahman Ghurri
  </text>

  <!-- Engineering Role Title -->
  <text x="64" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="url(#accentGrad)" letter-spacing="0.2">
    AI &amp; Full-Stack Systems Engineer
  </text>

  <!-- Concise Value Proposition -->
  <text x="64" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94A3B8">
    Architecting production LLM/RAG pipelines, high-concurrency Go &amp; Python backends, and Smart City telemetry platforms.
  </text>

  <!-- Domain Capability Pills -->
  <g transform="translate(64, 228)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="195" height="34" rx="8" fill="#0F1D32" stroke="#1E3A5F" stroke-width="1"/>
    <text x="97.5" y="21.5" text-anchor="middle" fill="#38BDF8">GenAI · LLM · RAG</text>

    <!-- Pill 2 -->
    <rect x="209" y="0" width="215" height="34" rx="8" fill="#131B36" stroke="#2B3566" stroke-width="1"/>
    <text x="316.5" y="21.5" text-anchor="middle" fill="#818CF8">Go · FastAPI · TypeScript</text>

    <!-- Pill 3 -->
    <rect x="438" y="0" width="225" height="34" rx="8" fill="#181836" stroke="#362C66" stroke-width="1"/>
    <text x="550.5" y="21.5" text-anchor="middle" fill="#C084FC">Computer Vision · PyTorch</text>

    <!-- Pill 4 -->
    <rect x="677" y="0" width="235" height="34" rx="8" fill="#0F1F2E" stroke="#1D4052" stroke-width="1"/>
    <text x="794.5" y="21.5" text-anchor="middle" fill="#34D399">Flutter · Laravel · IoT Grid</text>
  </g>
</svg>

