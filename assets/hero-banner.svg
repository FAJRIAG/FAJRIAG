    </text>
  </g>

  <!-- Full Name -->
  <text x="48" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.8">
    Fajri Abdurahman Ghurri
