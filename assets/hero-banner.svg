<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.10; }
        50% { opacity: 0.22; }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes scanlineMove {
        0% { transform: translateY(0px); opacity: 0; }
        15% { opacity: 0.35; }
        85% { opacity: 0.35; }
        100% { transform: translateY(290px); opacity: 0; }
      }
      @keyframes barLoad1 {
        0%, 100% { width: 92px; }
        50% { width: 115px; }
      }
      @keyframes barLoad2 {
        0%, 100% { width: 104px; }
        50% { width: 82px; }
      }
      @keyframes barLoad3 {
        0%, 100% { width: 88px; }
        50% { width: 112px; }
      }
      @keyframes barLoad4 {
        0%, 100% { width: 108px; }
        50% { width: 94px; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -24; }
      }
      .glow-1 { animation: pulseGlow 4s ease-in-out infinite; }
      .glow-2 { animation: pulseGlow 5s ease-in-out infinite 2s; }
      .cursor { animation: cursorBlink 1s infinite; }
      .scanline { animation: scanlineMove 5s linear infinite; }
      .flow-line { stroke-dasharray: 6 6; animation: dashFlow 1.2s linear infinite; }
      .bar-1 { animation: barLoad1 3s ease-in-out infinite; }
      .bar-2 { animation: barLoad2 3.4s ease-in-out infinite; }
      .bar-3 { animation: barLoad3 2.6s ease-in-out infinite; }
      .bar-4 { animation: barLoad4 3.8s ease-in-out infinite; }
    </style>

    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="80%" stop-color="#818CF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0.96"/>
    </linearGradient>

    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="ambientGlow1" cx="20%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientGlow2" cx="82%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
    </radialGradient>

    <pattern id="engGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>

    <clipPath id="bannerClip">
      <rect width="1200" height="430" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Base Canvas -->
    <rect width="1200" height="430" rx="14" fill="url(#bgMain)"/>
    <rect width="1200" height="430" rx="14" fill="url(#engGrid)"/>
    <rect class="glow-1" width="1200" height="430" rx="14" fill="url(#ambientGlow1)"/>
    <rect class="glow-2" width="1200" height="430" rx="14" fill="url(#ambientGlow2)"/>

    <!-- Background Animated Circuit Stream between Left & Right Columns -->
    <g opacity="0.35">
      <path class="flow-line" d="M 650 140 L 692 140" stroke="#38BDF8" stroke-width="1.5" fill="none"/>
      <path class="flow-line" d="M 650 232 L 692 232" stroke="#818CF8" stroke-width="1.5" fill="none"/>
      <path class="flow-line" d="M 650 324 L 692 324" stroke="#10B981" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Outer Precision Border -->
    <rect x="1" y="1" width="1198" height="428" rx="13" fill="none" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Animated Sweeping Laser Highlight on Top Border -->
    <rect x="-320" y="0.5" width="320" height="2.5" fill="url(#laserBeam)">
      <animate attributeName="x" values="-320;1200;-320" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- ================= LEFT COLUMN: EXECUTIVE IDENTITY & KPI METRICS (x: 44..660) ================= -->

    <!-- Top Status Badge with Expanding Radar Ping -->
    <g transform="translate(44, 34)">
      <rect x="0" y="0" width="510" height="28" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#10B981">
        <animate attributeName="r" values="4;11" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="16" cy="14" r="4" fill="#10B981"/>
      <text x="30" y="18" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.8" font-weight="600" fill="#94A3B8" letter-spacing="0.8">
        FULL-STACK · AI SYSTEMS · DEVOPS &amp; CLOUD INFRASTRUCTURE
      </text>
    </g>

    <!-- Full Name -->
    <text x="44" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.6">
      Fajri Abdurahman Ghurri
    </text>

    <!-- Primary Engineering Title + Inline Stack via tspan -->
    <text x="44" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#38BDF8">
      Full-Stack, AI Systems &amp; DevOps Engineer
      <tspan dx="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.2" font-weight="500" fill="#64748B">// TS · Go · Laravel · Docker</tspan>
    </text>

    <!-- Executive Summary Text -->
    <text x="44" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#94A3B8">
      Engineering scalable Full-Stack Web &amp; Mobile platforms, production AI/RAG pipelines,
    </text>
    <text x="44" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#94A3B8">
      high-concurrency Go backends, and automated DevOps &amp; Cloud server infrastructure.
    </text>

    <!-- Architectural Domain Tags with Subtle Animated Border Pulse -->
    <g transform="translate(44, 218)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.8" font-weight="600">
      <rect x="0" y="0" width="150" height="28" rx="5" fill="#0F172A" stroke="#0EA5E9" stroke-width="1">
        <animate attributeName="stroke-opacity" values="0.35;0.95;0.35" dur="3s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="75" y="18" text-anchor="middle" fill="#38BDF8">Full-Stack Web/App</text>

      <rect x="158" y="0" width="146" height="28" rx="5" fill="#0F172A" stroke="#6366F1" stroke-width="1">
        <animate attributeName="stroke-opacity" values="0.35;0.95;0.35" dur="3s" begin="0.75s" repeatCount="indefinite"/>
      </rect>
      <text x="231" y="18" text-anchor="middle" fill="#818CF8">Go &amp; Laravel API</text>

      <rect x="312" y="0" width="146" height="28" rx="5" fill="#0F172A" stroke="#A855F7" stroke-width="1">
        <animate attributeName="stroke-opacity" values="0.35;0.95;0.35" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <text x="385" y="18" text-anchor="middle" fill="#A78BFA">GenAI · LLM · RAG</text>

      <rect x="466" y="0" width="150" height="28" rx="5" fill="#0F172A" stroke="#10B981" stroke-width="1">
        <animate attributeName="stroke-opacity" values="0.35;0.95;0.35" dur="3s" begin="2.25s" repeatCount="indefinite"/>
      </rect>
      <text x="541" y="18" text-anchor="middle" fill="#34D399">DevOps &amp; Cloud</text>
    </g>

    <!-- 4 KPI Engineering Metric Cards with Live Animated Telemetry Bars -->
    <g transform="translate(44, 266)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="145" height="122" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
      <rect x="0" y="0" width="145" height="2.5" rx="1" fill="#38BDF8"/>
      <text x="14" y="34" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="22" font-weight="800" fill="#F8FAFC">11,380+</text>
      <text x="14" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#CBD5E1">Contributions</text>
      <text x="14" y="73" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#64748B">Full-Stack, AI &amp;</text>
      <text x="14" y="87" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#64748B">DevOps Delivery</text>
      <rect x="14" y="102" width="117" height="4" rx="2" fill="#1E293B"/>
      <rect class="bar-1" x="14" y="102" width="102" height="4" rx="2" fill="#38BDF8"/>

      <!-- Card 2 -->
      <rect x="157" y="0" width="145" height="122" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
      <rect x="157" y="0" width="145" height="2.5" rx="1" fill="#6366F1"/>
      <text x="171" y="34" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="22" font-weight="800" fill="#F8FAFC">66</text>
      <text x="171" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#CBD5E1">Engineered Repos</text>
      <text x="171" y="73" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#64748B">SaaS, APIs, Cloud</text>
      <text x="171" y="87" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#64748B">&amp; AI Systems</text>
      <rect x="171" y="102" width="117" height="4" rx="2" fill="#1E293B"/>
      <rect class="bar-2" x="171" y="102" width="96" height="4" rx="2" fill="#6366F1"/>

      <!-- Card 3 -->
      <rect x="314" y="0" width="145" height="122" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
      <rect x="314" y="0" width="145" height="2.5" rx="1" fill="#A855F7"/>
      <text x="328" y="34" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="22" font-weight="800" fill="#F8FAFC">99.9%</text>
      <text x="328" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#CBD5E1">Infra &amp; API SLA</text>
      <text x="328" y="73" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#64748B">Docker, CI/CD &amp;</text>
      <text x="328" y="87" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#64748B">Go Worker Pools</text>
      <rect x="328" y="102" width="117" height="4" rx="2" fill="#1E293B"/>
      <rect class="bar-3" x="328" y="102" width="100" height="4" rx="2" fill="#A855F7"/>

      <!-- Card 4 -->
      <rect x="471" y="0" width="145" height="122" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
      <rect x="471" y="0" width="145" height="2.5" rx="1" fill="#10B981"/>
      <text x="485" y="34" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="22" font-weight="800" fill="#F8FAFC">E2E</text>
      <text x="485" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#CBD5E1">Code to Cloud</text>
      <text x="485" y="73" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#64748B">UI/UX → Backend</text>
      <text x="485" y="87" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#64748B">→ AI → Cloud VPS</text>
      <rect x="485" y="102" width="117" height="4" rx="2" fill="#1E293B"/>
      <rect class="bar-4" x="485" y="102" width="108" height="4" rx="2" fill="#10B981"/>
    </g>

    <!-- ================= RIGHT COLUMN: ANIMATED TELEMETRY TERMINAL (x: 692..1156) ================= -->
    <g transform="translate(692, 34)">
      <!-- Terminal Window Container -->
      <rect x="0" y="0" width="464" height="354" rx="10" fill="url(#termGrad)" stroke="#1E293B" stroke-width="1.5"/>

      <!-- Animated Horizontal Scanline inside Terminal -->
      <rect class="scanline" x="2" y="36" width="460" height="2" fill="url(#scanGrad)"/>

      <!-- Terminal Title Bar -->
      <path d="M 0 10 Q 0 0 10 0 L 454 0 Q 464 0 464 10 L 464 34 L 0 34 Z" fill="#111827"/>
      <line x1="0" y1="34" x2="464" y2="34" stroke="#1E293B" stroke-width="1"/>

      <!-- Window Controls -->
      <circle cx="18" cy="17" r="5" fill="#EF4444" opacity="0.85"/>
      <circle cx="34" cy="17" r="5" fill="#F59E0B" opacity="0.85"/>
      <circle cx="50" cy="17" r="5" fill="#10B981" opacity="0.85"/>

      <text x="232" y="21" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#64748B">
        fajri@architect: ~/cluster-manifest.yaml
      </text>

      <!-- Terminal Code Content -->
      <g transform="translate(20, 56)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5">
        <text x="0" y="0" fill="#64748B"># Full-Stack, AI &amp; DevOps Infrastructure</text>

        <text x="0" y="21">
          <tspan fill="#38BDF8">engineer:</tspan>
          <tspan dx="8" fill="#E2E8F0">"Fajri Abdurahman Ghurri"</tspan>
        </text>

        <text x="0" y="41">
          <tspan fill="#38BDF8">role:</tspan>
          <tspan dx="35" fill="#34D399">"Full-Stack, AI &amp; DevOps Engineer"</tspan>
        </text>

        <text x="0" y="65" fill="#38BDF8">production_stack:</text>
        <text x="12" y="84">
          <tspan fill="#818CF8">frontend:</tspan>
          <tspan dx="21" fill="#CBD5E1">[TypeScript, Next.js, React, Flutter]</tspan>
        </text>
        <text x="12" y="103">
          <tspan fill="#818CF8">backend:</tspan>
          <tspan dx="28" fill="#CBD5E1">[Go, Laravel-12, FastAPI, Node.js]</tspan>
        </text>
        <text x="12" y="122">
          <tspan fill="#818CF8">ai_engine:</tspan>
          <tspan dx="14" fill="#CBD5E1">[LLMs, Hybrid-RAG, PyTorch, YOLOv8]</tspan>
        </text>
        <text x="12" y="141">
          <tspan fill="#818CF8">devops_sre:</tspan>
          <tspan dx="7" fill="#CBD5E1">[Docker, K8s, CI/CD, Nginx, Linux]</tspan>
        </text>
        <text x="12" y="160">
          <tspan fill="#818CF8">datastores:</tspan>
          <tspan dx="7" fill="#CBD5E1">[PostgreSQL, MySQL, Redis, VectorDB]</tspan>
        </text>

        <text x="0" y="186" fill="#38BDF8">live_infrastructure:</text>

        <!-- Cluster 1 with Pulsing Status Dot -->
        <circle cx="16" cy="201" r="3.5" fill="#10B981">
          <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" begin="0s" repeatCount="indefinite"/>
        </circle>
        <text x="26" y="205">
          <tspan fill="#94A3B8">fullstack_saas:</tspan>
          <tspan dx="14" fill="#10B981">ONLINE · ERP, Commerce &amp; Apps</tspan>
        </text>

        <!-- Cluster 2 with Pulsing Status Dot -->
        <circle cx="16" cy="221" r="3.5" fill="#10B981">
          <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" begin="0.5s" repeatCount="indefinite"/>
        </circle>
        <text x="26" y="225">
          <tspan fill="#94A3B8">ai_rag_gateway:</tspan>
          <tspan dx="14" fill="#10B981">ONLINE · Multi-LLM &amp; Vision</tspan>
        </text>

        <!-- Cluster 3 with Pulsing Status Dot -->
        <circle cx="16" cy="241" r="3.5" fill="#10B981">
          <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" begin="1.0s" repeatCount="indefinite"/>
        </circle>
        <text x="26" y="245">
          <tspan fill="#94A3B8">cloud_devops:</tspan>
          <tspan dx="28" fill="#10B981">ONLINE · Docker, CI/CD &amp; VPS</tspan>
        </text>

        <!-- Live Interactive Command Prompt with Blinking Block Cursor -->
        <text x="0" y="274">
          <tspan fill="#10B981">fajri@infra</tspan><tspan fill="#64748B">:</tspan><tspan fill="#38BDF8">~</tspan><tspan fill="#CBD5E1">$ kubectl get pods --all-ns </tspan><tspan class="cursor" fill="#38BDF8">█</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
