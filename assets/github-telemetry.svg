    <g transform="translate(22, 208)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#CBD5E1">
      <circle cx="6" cy="-4" r="4" fill="#6366F1"/>
      <text x="16" y="0">PHP &amp; Laravel (34%)</text>

      <circle cx="176" cy="-4" r="4" fill="#38BDF8"/>
      <text x="186" y="0">TypeScript / JS (25%)</text>

      <circle cx="356" cy="-4" r="4" fill="#3572A5"/>
      <text x="366" y="0">Python &amp; AI (24%)</text>
    </g>

    <!-- Language Legend Row 2 -->
    <g transform="translate(22, 228)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#CBD5E1">
      <circle cx="6" cy="-4" r="4" fill="#00ADD8"/>
      <text x="16" y="0">Go / Golang (10%)</text>

      <circle cx="176" cy="-4" r="4" fill="#10B981"/>
      <text x="186" y="0">Flutter / Swift / C++ (7%)</text>
    </g>
