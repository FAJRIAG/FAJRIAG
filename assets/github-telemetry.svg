      <text x="80" y="54" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">Peak Commit Streak</text>
      <text x="80" y="71" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">22d Active Streak</text>
    </g>

    <!-- Language Distribution Bar across 66 Repos -->
    <text x="22" y="164" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#94A3B8" letter-spacing="0.6">
