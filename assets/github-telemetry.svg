      <rect x="0" y="0" width="121" height="12" rx="3" fill="#3572A5"/>
      <!-- PHP / Laravel / Blade: 34% -> 171px -->
      <rect x="123" y="0" width="171" height="12" fill="#6366F1"/>
      <!-- TypeScript / JS: 25% -> 126px -->
      <rect x="296" y="0" width="126" height="12" fill="#38BDF8"/>
      <!-- Go (Golang): 10% -> 50px -->
      <rect x="424" y="0" width="50" height="12" fill="#00ADD8"/>
      <!-- Dart / Swift / C++: 7% -> 30px -->
      <rect x="476" y="0" width="28" height="12" rx="3" fill="#10B981"/>
