    <text x="22" y="30" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="0.8">
      REPOSITORY &amp; CONTRIBUTION METRICS
    </text>

    <!-- 3 Stat Columns inside Left Panel -->
    <!-- Stat 1 -->
    <g transform="translate(22, 52)">
      <rect x="0" y="0" width="160" height="84" rx="7" fill="#0F172A" stroke="#1E293B"/>
      <text x="80" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="23" font-weight="800" fill="#38BDF8">11,384</text>
      <text x="80" y="54" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">Total Contributions</text>
      <text x="80" y="71" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">11,229 in Last 12 Mos</text>
    </g>

    <!-- Stat 2 -->
    <g transform="translate(194, 52)">
      <rect x="0" y="0" width="160" height="84" rx="7" fill="#0F172A" stroke="#1E293B"/>
      <text x="80" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="23" font-weight="800" fill="#818CF8">66</text>
      <text x="80" y="54" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">Total Repositories</text>
