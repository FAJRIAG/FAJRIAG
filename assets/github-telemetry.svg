  </text>
  <line x1="36" y1="48" x2="1164" y2="48" stroke="#1E293B" stroke-width="1"/>

  <!-- ================= LEFT PANEL: CORE CONTRIBUTION & STREAK STATS (x: 36..584) ================= -->
  <g transform="translate(36, 66)">
    <rect x="0" y="0" width="548" height="246" rx="10" fill="url(#panelBg)" stroke="#1E293B" stroke-width="1.2"/>
