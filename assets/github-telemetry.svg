<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseStream {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes areaPulse {
        0%, 100% { opacity: 0.78; }
        50% { opacity: 1; }
      }
      .vel-stream {
        stroke-dasharray: 90 710;
        animation: pulseStream 3.2s linear infinite;
      }
      .vel-area {
        animation: areaPulse 3.5s ease-in-out infinite;
      }
    </style>

    <linearGradient id="telBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>

    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.42"/>
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="chartStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="telLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>

    <pattern id="telGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <clipPath id="telClip">
      <rect width="1200" height="340" rx="12"/>
    </clipPath>

    <clipPath id="barClip">
      <rect x="0" y="0" width="504" height="12" rx="3"/>
    </clipPath>
  </defs>

  <g clip-path="url(#telClip)">
    <!-- Main Frame -->
    <rect width="1200" height="340" rx="12" fill="url(#telBg)"/>
    <rect width="1200" height="340" rx="12" fill="url(#telGrid)"/>
    <rect x="1" y="1" width="1198" height="338" rx="11" fill="none" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Top Sweeping Laser -->
    <rect x="-280" y="0.5" width="280" height="2" fill="url(#telLaser)">
      <animate attributeName="x" values="-280;1200" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- Header with Radar Ping -->
    <circle cx="44" cy="30" r="4" fill="#10B981">
      <animate attributeName="r" values="4;11" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="44" cy="30" r="4" fill="#10B981"/>
    <text x="58" y="34" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#38BDF8" letter-spacing="1.2">
      GITHUB ENGINEERING TELEMETRY // VERIFIED GRAPHQL METRICS (@FAJRIAG)
    </text>
    <text x="1164" y="34" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#64748B">
      2020 — PRESENT · 66 REPOSITORIES
    </text>
    <line x1="36" y1="48" x2="1164" y2="48" stroke="#1E293B" stroke-width="1"/>

    <!-- ================= LEFT PANEL: CORE CONTRIBUTION & STREAK STATS (x: 36..584) ================= -->
    <g transform="translate(36, 66)">
      <rect x="0" y="0" width="548" height="246" rx="10" fill="url(#panelBg)" stroke="#1E293B" stroke-width="1.2"/>
      <rect x="0" y="0" width="548" height="3" rx="1.5" fill="#38BDF8"/>

      <text x="22" y="30" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="0.8">
        REPOSITORY &amp; CONTRIBUTION METRICS
      </text>

      <!-- Stat 1 -->
      <g transform="translate(22, 52)">
        <rect x="0" y="0" width="160" height="84" rx="7" fill="#0F172A" stroke="#1E293B">
          <animate attributeName="stroke" values="#1E293B;#0EA5E9;#1E293B" dur="4s" begin="0s" repeatCount="indefinite"/>
        </rect>
        <text x="80" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="23" font-weight="800" fill="#38BDF8">11,384</text>
        <text x="80" y="54" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">Total Contributions</text>
        <text x="80" y="71" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">11,229 in Last 12 Mos</text>
      </g>

      <!-- Stat 2 -->
      <g transform="translate(194, 52)">
        <rect x="0" y="0" width="160" height="84" rx="7" fill="#0F172A" stroke="#1E293B">
          <animate attributeName="stroke" values="#1E293B;#6366F1;#1E293B" dur="4s" begin="1.3s" repeatCount="indefinite"/>
        </rect>
        <text x="80" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="23" font-weight="800" fill="#818CF8">66</text>
        <text x="80" y="54" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">Total Repositories</text>
        <text x="80" y="71" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">Full-Stack &amp; AI</text>
      </g>

      <!-- Stat 3 -->
      <g transform="translate(366, 52)">
        <rect x="0" y="0" width="160" height="84" rx="7" fill="#0F172A" stroke="#1E293B">
          <animate attributeName="stroke" values="#1E293B;#10B981;#1E293B" dur="4s" begin="2.6s" repeatCount="indefinite"/>
        </rect>
        <text x="80" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="23" font-weight="800" fill="#10B981">34 Days</text>
        <text x="80" y="54" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">Peak Commit Streak</text>
        <text x="80" y="71" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">22d Active Streak</text>
      </g>

      <!-- Language Distribution Bar across 66 Repos -->
      <text x="22" y="164" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#94A3B8" letter-spacing="0.6">
        CODEBASE DISTRIBUTION BY PRIMARY LANGUAGE (66 REPOSITORIES)
      </text>

      <!-- Multi-Segment Stacked Bar with Animated Shimmer Sweep -->
      <g transform="translate(22, 176)" clip-path="url(#barClip)">
        <rect x="0" y="0" width="121" height="12" rx="3" fill="#3572A5"/>
        <rect x="123" y="0" width="171" height="12" fill="#6366F1"/>
        <rect x="296" y="0" width="126" height="12" fill="#38BDF8"/>
        <rect x="424" y="0" width="50" height="12" fill="#00ADD8"/>
        <rect x="476" y="0" width="28" height="12" rx="3" fill="#10B981"/>
        <!-- Animated Shimmer Highlight -->
        <rect x="-120" y="0" width="120" height="12" fill="url(#shimmerGrad)">
          <animate attributeName="x" values="-120;520" dur="3.2s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Language Legend Row 1 -->
      <g transform="translate(22, 208)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#CBD5E1">
        <circle cx="6" cy="-4" r="4" fill="#6366F1"/>
        <text x="16" y="0">PHP &amp; Laravel (34%)</text>

        <circle cx="176" cy="-4" r="4" fill="#38BDF8"/>
        <text x="186" y="0">TypeScript / JS (25%)</text>

        <circle cx="356" cy="-4" r="4" fill="#3572A5"/>
        <text x="366" y="0">Python &amp; AI (24%)</text>
      </g>

      <!-- Language Legend Row 2 -->
      <g transform="translate(22, 228)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#CBD5E1">
        <circle cx="6" cy="-4" r="4" fill="#00ADD8"/>
        <text x="16" y="0">Go / Golang (10%)</text>

        <circle cx="176" cy="-4" r="4" fill="#10B981"/>
        <text x="186" y="0">Flutter / Swift / C++ (7%)</text>
      </g>
    </g>

    <!-- ================= RIGHT PANEL: 52-WEEK CONTRIBUTION VELOCITY CHART (x: 608..1164) ================= -->
    <g transform="translate(608, 66)">
      <rect x="0" y="0" width="556" height="246" rx="10" fill="url(#panelBg)" stroke="#1E293B" stroke-width="1.2"/>
      <rect x="0" y="0" width="556" height="3" rx="1.5" fill="#818CF8"/>

      <text x="22" y="30" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="0.8">
        ANNUAL CONTRIBUTION VELOCITY (11,229 COMMITS &amp; PRs)
      </text>
      <text x="534" y="30" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#10B981">
        PEAK: 2,934 / WK
      </text>

      <!-- Chart Grid Lines -->
      <g stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3">
        <line x1="24" y1="60" x2="532" y2="60"/>
        <line x1="24" y1="106" x2="532" y2="106"/>
        <line x1="24" y1="152" x2="532" y2="152"/>
        <line x1="24" y1="198" x2="532" y2="198"/>
      </g>

      <!-- Area, Base Curve & Animated Laser Stream -->
      <path class="vel-area" d="M 24 198 L 24 194 L 50 195 L 76 190 L 102 186 L 128 178 L 154 166 L 180 158 L 206 164 L 232 145 L 258 160 L 284 152 L 310 168 L 336 174 L 362 62 L 386 98 L 410 92 L 434 84 L 458 135 L 482 118 L 506 132 L 532 124 L 532 198 Z" fill="url(#chartFill)"/>

      <path d="M 24 194 L 50 195 L 76 190 L 102 186 L 128 178 L 154 166 L 180 158 L 206 164 L 232 145 L 258 160 L 284 152 L 310 168 L 336 174 L 362 62 L 386 98 L 410 92 L 434 84 L 458 135 L 482 118 L 506 132 L 532 124" fill="none" stroke="url(#chartStroke)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <path class="vel-stream" d="M 24 194 L 50 195 L 76 190 L 102 186 L 128 178 L 154 166 L 180 158 L 206 164 L 232 145 L 258 160 L 284 152 L 310 168 L 336 174 L 362 62 L 386 98 L 410 92 L 434 84 L 458 135 L 482 118 L 506 132 L 532 124" fill="none" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Animated Tracer Particle Traveling Along the Velocity Curve -->
      <circle r="5" fill="#38BDF8" opacity="0.35">
        <animateMotion dur="5s" repeatCount="indefinite" path="M 24 194 L 50 195 L 76 190 L 102 186 L 128 178 L 154 166 L 180 158 L 206 164 L 232 145 L 258 160 L 284 152 L 310 168 L 336 174 L 362 62 L 386 98 L 410 92 L 434 84 L 458 135 L 482 118 L 506 132 L 532 124"/>
      </circle>
      <circle r="2.5" fill="#FFFFFF">
        <animateMotion dur="5s" repeatCount="indefinite" path="M 24 194 L 50 195 L 76 190 L 102 186 L 128 178 L 154 166 L 180 158 L 206 164 L 232 145 L 258 160 L 284 152 L 310 168 L 336 174 L 362 62 L 386 98 L 410 92 L 434 84 L 458 135 L 482 118 L 506 132 L 532 124"/>
      </circle>

      <!-- Key Highlight Nodes with Radar Ping on Peak & Current -->
      <circle cx="232" cy="145" r="3.5" fill="#38BDF8"/>

      <!-- Peak Node Radar Ping -->
      <circle cx="362" cy="62" r="4.5" fill="none" stroke="#38BDF8" stroke-width="1.5">
        <animate attributeName="r" values="4.5;14" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="362" cy="62" r="4.5" fill="#38BDF8" stroke="#090D16" stroke-width="1.5"/>

      <circle cx="434" cy="84" r="4" fill="#818CF8" stroke="#090D16" stroke-width="1.5"/>
      <circle cx="482" cy="118" r="3.5" fill="#38BDF8"/>

      <!-- Current Q4 Node Radar Ping -->
      <circle cx="532" cy="124" r="4" fill="none" stroke="#10B981" stroke-width="1.5">
        <animate attributeName="r" values="4;12" dur="2s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="2s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="532" cy="124" r="4" fill="#10B981"/>

      <!-- X-Axis Labels -->
      <g transform="translate(0, 222)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#64748B">
        <text x="24" y="0">Q1 (Nov-Jan)</text>
        <text x="165" y="0">Q2 (Feb-Apr)</text>
        <text x="315" y="0">Q3 Sprint Peak</text>
        <text x="532" y="0" text-anchor="end">Q4 (Current)</text>
      </g>
    </g>
  </g>
</svg>
