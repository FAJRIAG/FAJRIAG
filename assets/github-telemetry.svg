    <!-- Chart Grid Lines (x: 24..532, y: 54..198) -->
    <g stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3">
      <line x1="24" y1="60" x2="532" y2="60"/>
      <line x1="24" y1="106" x2="532" y2="106"/>
      <line x1="24" y1="152" x2="532" y2="152"/>
      <line x1="24" y1="198" x2="532" y2="198"/>
    </g>

    <!-- Area & Line Path representing actual 52-week contribution curve -->
    <path d="M 24 198 L 24 194 L 50 195 L 76 190 L 102 186 L 128 178 L 154 166 L 180 158 L 206 164 L 232 145 L 258 160 L 284 152 L 310 168 L 336 174 L 362 62 L 386 98 L 410 92 L 434 84 L 458 135 L 482 118 L 506 132 L 532 124 L 532 198 Z" fill="url(#chartFill)"/>

    <path d="M 24 194 L 50 195 L 76 190 L 102 186 L 128 178 L 154 166 L 180 158 L 206 164 L 232 145 L 258 160 L 284 152 L 310 168 L 336 174 L 362 62 L 386 98 L 410 92 L 434 84 L 458 135 L 482 118 L 506 132 L 532 124" fill="none" stroke="url(#chartStroke)" stroke-width="2.5" stroke-Linecap="round" stroke-linejoin="round"/>

    <!-- Key Highlight Nodes on Curve -->
    <circle cx="232" cy="145" r="3.5" fill="#38BDF8"/>
    <circle cx="362" cy="62" r="4.5" fill="#38BDF8" stroke="#090D16" stroke-width="1.5"/>
    <circle cx="434" cy="84" r="4" fill="#818CF8" stroke="#090D16" stroke-width="1.5"/>
    <circle cx="482" cy="118" r="3.5" fill="#38BDF8"/>
    <circle cx="532" cy="124" r="4" fill="#10B981"/>

    <!-- X-Axis Labels -->
    <g transform="translate(0, 222)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#64748B">
      <text x="24" y="0">Q1 (Nov-Jan)</text>
      <text x="165" y="0">Q2 (Feb-Apr)</text>
      <text x="315" y="0">Q3 Sprint Peak</text>
      <text x="532" y="0" text-anchor="end">Q4 (Current)</text>
    </g>
