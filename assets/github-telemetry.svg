<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="telBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>

    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="chartStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <pattern id="telGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Main Frame -->
  <rect width="1200" height="340" rx="12" fill="url(#telBg)"/>
  <rect width="1200" height="340" rx="12" fill="url(#telGrid)"/>
  <rect x="1" y="1" width="1198" height="338" rx="11" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Header -->
  <circle cx="44" cy="30" r="4" fill="#10B981">
