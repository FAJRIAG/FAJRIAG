<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 115" width="100%" height="100%">
  <defs>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="fTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.12"/>
    </linearGradient>
    <clipPath id="footerClip">
      <rect width="1200" height="115" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footerClip)">
    <rect width="1200" height="115" rx="12" fill="url(#fBg)" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Animated Flowing Sine Waves at Bottom -->
    <g>
      <path d="M 0 88 Q 150 72 300 88 T 600 88 T 900 88 T 1200 88 T 1500 88 T 1800 88 T 2100 88 T 2400 88 L 2400 120 L 0 120 Z" fill="url(#waveGrad1)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M -1200 94 Q -1050 108 -900 94 T -600 94 T -300 94 T 0 94 T 300 94 T 600 94 T 900 94 T 1200 94 L 1200 120 L -1200 120 Z" fill="url(#waveGrad2)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="1200 0" dur="12s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Top Sweeping Laser Line -->
    <rect x="-300" y="0.5" width="300" height="2" fill="url(#fTop)">
      <animate attributeName="x" values="-300;1200;-300" dur="8s" repeatCount="indefinite"/>
    </rect>

    <text x="600" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#E2E8F0" letter-spacing="1.8">
      FAJRI ABDURAHMAN GHURRI // FULL-STACK SOFTWARE &amp; AI SYSTEMS ENGINEER
    </text>
    <text x="600" y="65" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#94A3B8">
      TypeScript · Next.js · React · Go · Laravel 12 · Python · FastAPI · Flutter · PyTorch · PostgreSQL · Indonesia
    </text>
  </g>
</svg>
